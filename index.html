    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],

  <style>
    html, body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #F8FAFC; color: #0F172A; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

    /* HUL Risk Band Palette */
    .band-Critical { background-color: #8E2B2B; color: #FFFFFF; }
    .band-High { background-color: #C9822F; color: #FFFFFF; }
    .band-Medium { background-color: #F1DBA8; color: #5C4312; }
    .band-Low { background-color: #E3E9F0; color: #334155; }
    .band-Blocked { background-color: #334155; color: #F8FAFC; }
    .band-Awaiting { background-color: #F1F5F9; color: #475569; border: 1px dashed #94A3B8; }
    .band-Excluded { background-color: #F1F5F9; color: #94A3B8; }

    .mono-num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

    .step-pill { transition: all 160ms ease; }
    .heatmap-cell { transition: transform 120ms ease, box-shadow 120ms ease; }
    .heatmap-cell:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08); z-index: 5; }

    .card-surface { background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03); }
    .fade-in { animation: fadeIn 180ms ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    @media print {
      .no-print { display: none !important; }
      body { background: #FFFFFF; }
    }
  </style>

// ---------- 3. DETERMINISTIC SCORING ENGINE (R00–R90) ----------
const BAND_RANK = { "Low": 1, "Medium": 2, "High": 3, "Critical": 4 };
const CONTROL_RANK = { "Strong": 4, "Adequate": 3, "Weak": 2, "Ineffective": 1 };
const CONTROL_BY_RANK = { 4: "Strong", 3: "Adequate", 2: "Weak", 1: "Ineffective" };

function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }

function getBand(score, cfg) {
  if (score >= Number(cfg.p_band_crit)) return "Critical";
  if (score >= Number(cfg.p_band_high)) return "High";
  if (score >= Number(cfg.p_band_med)) return "Medium";
  return "Low";
}
function maxBand(a, b) { return (BAND_RANK[a] || 0) >= (BAND_RANK[b] || 0) ? a : b; }

function scoreInterim(ob, cfg) {
  const k = ob.komrisk;
  if (!k || k.status === "TRIGGERED (Deactivated)") {
    return { missing: true, design: 0, ownership: 0, frequency: 0, maturity: 0, total: 0, rating: cfg.p_ctl_fixed };
  }
  const design = k.requiresProof === "Yes" ? 2 : 1;
  const ownership = (k.owner && k.reviewer && k.owner !== k.reviewer) ? 2 : 1;
  let frequency = 1;
  if (ob.statutoryFreq === "Continuing") frequency = 1;
  else if (ob.statutoryFreq === "Event-driven" || ob.statutoryFreq === "One-time") frequency = k.hasDueDate ? 2 : 1;
  else {
    const kr = TABLES.freqRank[k.freq] || 5;
    const sr = TABLES.freqRank[ob.statutoryFreq] || 4;
    frequency = kr === 5 ? 0 : (kr <= sr ? 2 : 1);
  }
  const maturity = (k.escLevels >= 2 && k.hasReminder) ? 2 : ((k.escLevels >= 1 || k.hasReminder) ? 1 : 0);
  const total = design + ownership + frequency + maturity;
  let rating = total >= 7 ? "Adequate" : (total >= 4 ? "Weak" : "Ineffective");
  const capRank = CONTROL_RANK[cfg.p_interim_cap] || 3;
  if (CONTROL_RANK[rating] > capRank) rating = CONTROL_BY_RANK[capRank];
  return { missing: false, design, ownership, frequency, maturity, total, rating };
}

function computeOne(ob, cfg, overrideObj = null) {
  const trace = [];
  if (ob.applicability === "Blocked" || !ob.citation || !ob.firstDefaultSanction) {
    trace.push({ rule: "R02", text: "Blocked: missing statutory citation or first-default sanction. Routed to legal research." });
    return {
      ref: ob.ref, ob, blocked: true, inDistribution: false,
      L: null, L_label: "—", I: null, dims: {}, mainDriver: "—", velClass: "—", V: null,
      calc: null, calcBand: "Blocked", controlRoute: "—", controlRating: "—", cef: null, interim: null,
      res: null, resBand: "Blocked", resBandDisplay: "Blocked",
      sysRes: null, sysResBand: "Blocked", floorNote: "Blocked",
      evidenceStatus: "Blocked", scoreStatus: "Not scored",
      isOverridden: false, overrideObj: null, trace
    };
  }

  const inDistribution = ob.applicability === "Confirmed";
  if (!inDistribution) trace.push({ rule: "R01", text: "Applicability is Unconfirmed: scored for visibility but excluded from executive distribution." });

  // Evidence layer (R05)
  let intStatus = "Default";
  if (cfg.p_ev_mode !== "Default only") {
    if (ob.intensityBasis === "Database tag") intStatus = "Evidence-based";
    else if (ob.intensityBasis === "Lawyer assessment") intStatus = cfg.p_lawyer_int === "Partial (use value)" ? "Partial" : "Default";
  }
  const histStatus = (cfg.p_ev_mode !== "Default only" && ob.noticesConfirmed === "Y") ? "Evidence-based" : "Default";
  const ctlStatus = (cfg.p_ev_mode !== "Default only" && ((ob.obligationType === "Event-based" && ob.execInstances >= 1) || ob.execInstances >= 6)) ? "Evidence-based" : "Default";
  const evidenceStatus = (intStatus === "Default" || histStatus === "Default" || ctlStatus === "Default")
    ? "Default" : (intStatus === "Evidence-based" && histStatus === "Evidence-based" && ctlStatus === "Evidence-based" ? "Evidence-based" : "Partial");
  const scoreStatus = evidenceStatus === "Evidence-based" ? "Final" : "Provisional";

  // Likelihood (R10–R13)
  let L_base = (intStatus === "Evidence-based" || intStatus === "Partial")
    ? (TABLES.t_intensity[ob.enforcementIntensity]?.score || 3)
    : Math.max(Number(cfg.p_int_min), (ob.statuteRequiresLRM === "Y" && cfg.p_int_def === "Statute-derived") ? 4 : 3);
  trace.push({ rule: "R10", text: `Base Likelihood = ${L_base} (${intStatus === "Default" ? "R06 statute-derived default" : ob.enforcementIntensity}).` });

  // Site / Climate modifiers (R11)
  const ss = cfg.siteSettings[ob.site] || {};
  let netMod = 0;
  const activeMods = [];
  if (histStatus === "Default" && cfg.p_hist_def === "+1") { netMod += 1; activeMods.push("E04 History Default (+1)"); }
  if (ss.lm01_contractLabour && (ob.category === "Labour and employment" || ob.category === "Product, quality and metrology")) { netMod += 1; activeMods.push("LM01 Contract Labour/SKU (+1)"); }
  if (ss.lm02_hazardous && (ob.category === "Health, safety and factory" || ob.category === "Environment")) { netMod += 1; activeMods.push("LM02 Hazardous/MAH (+1)"); }
  if (ss.lc01_drive) { netMod += 1; activeMods.push("LC01 Active Enforcement Drive (+1)"); }
  const cappedMod = Math.max(-2, Math.min(2, netMod));
  let sysL = Math.max(1, Math.min(5, L_base + cappedMod));
  if (activeMods.length) trace.push({ rule: "R11/R12", text: `Active modifiers [${activeMods.join(", ")}] => Net ${cappedMod >= 0 ? "+" + cappedMod : cappedMod}, Likelihood = ${sysL}.` });

  // Impact (R20–R25)
  const baseSanc = TABLES.t_sanction[ob.firstDefaultSanction] || 1;
  const scopeEligible = ["Seizure or recall of stock", "Licence suspension or cancellation", "Closure or stop-production direction"].includes(ob.firstDefaultSanction);
  const scopeEsc = (cfg.p_scope === "On" && ob.scope === "Multi-site or national" && scopeEligible) ? 1 : 0;
  const fineVal = Number(ob.firstDefaultMaxFine || 0);
  const fineBand = fineVal <= 0 ? 1 : (fineVal <= Number(cfg.p_fine_b2) ? 2 : (fineVal <= Number(cfg.p_fine_b3) ? 3 : (fineVal <= Number(cfg.p_fine_b4) ? 4 : 5)));
  const countRepeat = (cfg.p_repeat === "Always" || ob.priorDefault === "Y" || cfg.p_basis === "Statutory maximum");
  const repeatTerm = (countRepeat && ob.repeatOnlySanction !== "None") ? (TABLES.t_sanction[ob.repeatOnlySanction] || 1) : 1;
  const officerEsc = (ob.officerImprisonment === "Y" && (cfg.p_officer === "On" || cfg.p_basis === "Statutory maximum")) ? 1 : 0;
  const regLevel = Math.min(5, Math.max(baseSanc + scopeEsc, fineBand, repeatTerm) + officerEsc);
  trace.push({ rule: "R20", text: `Regulatory = min(5, max(sanction ${baseSanc}+scope ${scopeEsc}, fine band ${fineBand}, repeat ${repeatTerm}) + officer ${officerEsc}) = ${regLevel}.` });

  let bcEff = cfg.p_dim_bc === "On" ? Math.min(5, ob.bcLevel + (ss.im01_soleSource ? 1 : 0)) : 0;
  let hseEff = cfg.p_dim_hse === "On" ? Math.min(5, ob.hseLevel + (ss.im02_receptor && ob.category === "Environment" ? 1 : 0)) : 0;
  let brEff = cfg.p_dim_br === "On" ? Math.max(ob.brandLevel, ob.consumerFacing === "Y" ? 3 : 0) : 0;
  let finEff = cfg.p_dim_fin === "On" ? ob.finLevel : 0;
  let regEff = cfg.p_dim_reg === "On" ? regLevel : 0;

  const dims = { Regulatory: regEff, "Business Continuity": bcEff, HSE: hseEff, Brand: brEff, Financial: finEff };
  const activeVals = Object.values(dims).filter(v => v > 0).sort((a, b) => b - a);
  let sysI = activeVals.length === 0 ? 1 : (cfg.p_agg === "Maximum" || activeVals.length < 2 ? activeVals[0] : Math.ceil((activeVals[0] + activeVals[1]) / 2));
  let mainDriver = "Regulatory", maxD = -1;
  Object.entries(dims).forEach(([k, v]) => { if (v > maxD) { maxD = v; mainDriver = k; } });
  trace.push({ rule: "R25", text: `Impact (${cfg.p_agg}) across 5 dimensions = ${sysI} (primary driver: ${mainDriver}).` });

  // Velocity (R30–R31)
  let sysVelClass = TABLES.t_mech[ob.enforcementMechanism] || "Medium";
  let sysV = TABLES.t_vel[sysVelClass].factor;
  trace.push({ rule: "R30/R31", text: `Velocity = ${sysVelClass} (${sysV}x) from '${ob.enforcementMechanism}'.` });

  // Control (R50–R56)
  const interim = scoreInterim(ob, cfg);
  let controlRoute = "Interim";
  let sysControlRating = ob.isCalibration ? ob.controlRatingAssessed : interim.rating;
  if (ctlStatus === "Evidence-based") {
    controlRoute = "Evidence-based";
    sysControlRating = ob.controlRatingAssessed;
  } else if (cfg.p_ctl_def === "Fixed rating" || interim.missing) {
    controlRoute = "Interim (Fixed)";
    sysControlRating = cfg.p_ctl_fixed;
  } else {
    const capR = CONTROL_RANK[cfg.p_interim_cap] || 3;
    if (CONTROL_RANK[sysControlRating] > capR) sysControlRating = CONTROL_BY_RANK[capR];
  }
  const sysCef = TABLES.t_cef[sysControlRating] ?? 0.8;
  const sysCalc = round2(sysL * sysI * sysV);
  const sysCalcBand = getBand(sysCalc, cfg);
  const sysRes = round2(sysCalc * sysCef);
  let sysResBand = getBand(sysRes, cfg);

  const r61Triggered = ["Closure or stop-production direction", "Licence suspension or cancellation"].includes(ob.firstDefaultSanction) && sysVelClass === "High";
  let floorNote = "None";
  if (r61Triggered) {
    const floored = maxBand(sysResBand, "High");
    floorNote = floored !== sysResBand ? "Floor R61 raised band to High" : "Floor R61 met (holds High)";
    sysResBand = floored;
    trace.push({ rule: "R61", text: `${floorNote} (system-driven closure/suspension guardrail).` });
  }
  trace.push({ rule: "R60", text: `System Score: Calculated ${sysCalc} (${sysCalcBand}) × CEF ${sysCef} (${sysControlRating}) = Residual ${sysRes} (${sysResBand}).` });

  // Apply Expert Override (Step 5) if present
  let L = sysL, I = sysI, velClass = sysVelClass, controlRating = sysControlRating, resBand = sysResBand;
  let isOverridden = false;
  if (overrideObj) {
    isOverridden = true;
    if (overrideObj.L !== undefined && overrideObj.L !== null) L = Math.max(1, Math.min(5, Number(overrideObj.L)));
    if (overrideObj.I !== undefined && overrideObj.I !== null) I = Math.max(1, Math.min(5, Number(overrideObj.I)));
    if (overrideObj.velClass) velClass = overrideObj.velClass;
    if (overrideObj.controlRating) controlRating = overrideObj.controlRating;
  }

  const V = TABLES.t_vel[velClass].factor;
  const cef = TABLES.t_cef[controlRating] ?? 0.8;
  const calc = round2(L * I * V);
  const calcBand = getBand(calc, cfg);
  const res = round2(calc * cef);
  resBand = getBand(res, cfg);
  if (r61Triggered) resBand = maxBand(resBand, "High");
  if (overrideObj && overrideObj.bandOverride) {
    if (!(r61Triggered && BAND_RANK[overrideObj.bandOverride] < BAND_RANK["High"])) {
      resBand = overrideObj.bandOverride;
    }
  }
  if (isOverridden) {
    trace.push({ rule: "R70", text: `Expert Override (${overrideObj.reasonCode}): adjusted to L=${L}, I=${I}, Control=${controlRating} => Residual ${res} (${resBand}). Comment: "${overrideObj.comment}"` });
  }

  const resBandDisplay = (cfg.p_ev_mode === "Evidence required" && evidenceStatus !== "Evidence-based") ? "Awaiting evidence" : resBand;

  return {
    ref: ob.ref, ob, blocked: false, inDistribution,
    L, L_label: TABLES.labelByL[L] || "Possible", I, dims, mainDriver, velClass, V,
    calc, calcBand, controlRoute, controlRating, cef, interim,
    res, resBand, resBandDisplay,
    sysL, sysI, sysVelClass, sysControlRating, sysCalc, sysCalcBand, sysRes, sysResBand,
    floorNote, r61Triggered, evidenceStatus, scoreStatus, intStatus, histStatus, ctlStatus,
    isOverridden, overrideObj, trace
  };
}

// ---------- 5. CORE HELPERS ----------
function bandBadge(band, size = "sm") {
  const cls = band === "Awaiting evidence" ? "band-Awaiting" : `band-${band}`;
  const pad = size === "xs" ? "px-1.5 py-0.5 text-[10px]" : "px-2 py-0.5 text-[11px]";
  return `<span class="inline-flex items-center font-semibold rounded-md ${pad} ${cls}">${band}</span>`;
}

function showToast(msg, type = "info") {
  const styles = {
    info: "bg-slate-900 text-white",
    success: "bg-emerald-700 text-white",
    warning: "bg-amber-700 text-white",
    error: "bg-rose-700 text-white"
  };
  const el = document.createElement("div");
  el.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg text-xs font-medium ${styles[type] || styles.info}`;
  el.textContent = msg;
  document.getElementById("toastStack").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity 280ms"; setTimeout(() => el.remove(), 300); }, 3000);
}

function getSelectedObligations() {
  return MASTER_LIBRARY.filter(o => APP.selectedRefs.has(o.ref));
}

function executeScoringEngine(increment = false) {
  const t0 = performance.now();
  if (increment) APP.scoringRunCount++;
  const obs = getSelectedObligations();
  const rows = obs.map(o => computeOne(o, APP.config, APP.overrides[o.ref] || null));
  rows.sort((a, b) => {
    const ba = BAND_RANK[a.resBand] || 0, bb = BAND_RANK[b.resBand] || 0;
    if (bb !== ba) return bb - ba;
    if ((b.res || 0) !== (a.res || 0)) return (b.res || 0) - (a.res || 0);
    if ((b.I || 0) !== (a.I || 0)) return (b.I || 0) - (a.I || 0);
    return a.ref.localeCompare(b.ref);
  });
  APP.scoredRows = rows;
  APP.lastRunMs = Math.max(0.5, round2(performance.now() - t0));
}

function goToStep(stepNum) {
  if (stepNum > 1 && APP.selectedRefs.size === 0) {
    showToast("Please select at least one compliance from the Komrisk library first.", "warning");
    return;
  }
  APP.step = stepNum;
  if (stepNum > APP.maxReachedStep) APP.maxReachedStep = stepNum;
  if (stepNum >= 4) executeScoringEngine(false);
  if (stepNum === 2 && !APP.selectedRefs.has(APP.extractSelectedRef)) {
    APP.extractSelectedRef = [...APP.selectedRefs][0] || "RQ-002";
  }
  renderApp();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function destroyCharts() {
  Object.values(APP.charts).forEach(c => { try { c.destroy(); } catch (e) {} });
  APP.charts = {};
}

// ---------- 6. STEPPER & SHELL RENDER ----------
function renderStepper() {
  document.getElementById("headerSelectionPill").innerHTML = `
    <span class="w-1.5 h-1.5 rounded-full bg-indigo-600"></span>
    <span>${APP.selectedRefs.size} compliance${APP.selectedRefs.size === 1 ? "" : "s"} in scope</span>
  `;

  const nav = document.getElementById("stepperNav");
  nav.innerHTML = STEPS.map((s, idx) => {
    const isActive = APP.step === s.id;
    const isDone = APP.step > s.id;
    const circleCls = isActive
      ? "bg-indigo-600 text-white shadow-xs"
      : isDone ? "bg-emerald-600 text-white" : "bg-white text-slate-500 border border-slate-300";
    const wrapCls = isActive
      ? "bg-white border-indigo-200 shadow-xs text-indigo-900"
      : "border-transparent text-slate-600 hover:bg-white/70 hover:text-slate-900";
    const arrow = idx < STEPS.length - 1 ? `<i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-300 shrink-0"></i>` : "";
    return `
      <button onclick="goToStep(${s.id})" class="step-pill flex items-center gap-2 px-2.5 py-1.5 rounded-lg border text-left ${wrapCls}">
        <span class="w-5 h-5 rounded-full text-[11px] font-semibold flex items-center justify-center shrink-0 ${circleCls}">
          ${isDone ? `<i data-lucide="check" class="w-3 h-3"></i>` : s.id}
        </span>
        <div class="leading-tight">
          <div class="text-xs font-semibold whitespace-nowrap">${s.title}</div>
          <div class="text-[10px] text-slate-400 whitespace-nowrap">${s.subtitle}</div>
        </div>
      </button>
      ${arrow}
    `;
  }).join("");
}

function renderApp() {
  destroyCharts();
  renderStepper();
  const main = document.getElementById("mainContent");
  switch (APP.step) {
    case 1: renderStep1Selection(main); break;
    case 2: renderStep2Extraction(main); break;
    case 3: renderStep3Config(main); break;
    case 4: renderStep4Scoring(main); break;
    case 5: renderStep5Overrides(main); break;
    case 6: renderStep6Dashboard(main); break;
  }
  if (window.lucide) lucide.createIcons();
}

function getFilteredLibrary() {
  const f = APP.filters;
  const q = f.search.toLowerCase();
  return MASTER_LIBRARY.filter(o => {
    if (f.entity !== "All" && o.entity !== f.entity) return false;
    if (f.site !== "All" && o.site !== f.site) return false;
    if (f.state !== "All" && o.state !== f.state) return false;
    if (f.law !== "All" && o.law !== f.law) return false;
    if (f.authority !== "All" && o.authority !== f.authority) return false;
    if (f.category !== "All" && o.category !== f.category) return false;
    if (f.func !== "All" && o.businessFunction !== f.func) return false;
    if (f.impact !== "All" && o.komrisk.failureImpact !== f.impact) return false;
    if (q && !(o.ref.toLowerCase().includes(q) || o.obligation.toLowerCase().includes(q) || o.law.toLowerCase().includes(q) || o.authority.toLowerCase().includes(q))) return false;
    return true;
  });
}

function toggleRef(ref) {
  if (APP.selectedRefs.has(ref)) APP.selectedRefs.delete(ref); else APP.selectedRefs.add(ref);
  renderApp();

function toggleSelectAllFiltered(checked) {
  const filtered = getFilteredLibrary();
  filtered.forEach(o => { if (checked) APP.selectedRefs.add(o.ref); else APP.selectedRefs.delete(o.ref); });
  renderApp();
}

function applyPreset(type) {
  if (type === "calibration") {
    APP.selectedRefs = new Set(MASTER_LIBRARY.filter(o => o.isCalibration).map(o => o.ref));
    showToast("Selected the 10 core HUL calibration compliances.", "info");
  } else if (type === "all") {
    APP.selectedRefs = new Set(MASTER_LIBRARY.map(o => o.ref));
    showToast(`Selected all ${MASTER_LIBRARY.length} enterprise library compliances.`, "info");
  } else if (type === "high") {
    APP.selectedRefs = new Set(MASTER_LIBRARY.filter(o => o.komrisk.failureImpact === "High").map(o => o.ref));
    showToast(`Selected ${APP.selectedRefs.size} Komrisk High Failure Impact compliances.`, "info");
  } else if (type === "clearFilters") {
    APP.filters = { search: "", entity: "All", site: "All", state: "All", law: "All", authority: "All", category: "All", func: "All", impact: "All" };
  }
  renderApp();
}

function sendToRegIQ() {
  if (APP.selectedRefs.size === 0) {
    showToast("Select at least one compliance to ingest into RegIQ.", "warning");
    return;

  showToast(`Ingested ${APP.selectedRefs.size} compliances from Komrisk into RegIQ.`, "success");
  goToStep(2);
}

              </div>
            </div>
          ` : ""}
        </div>
      </div>
    </div>
  `;
}

function prefillIndividualOverride() {
  const sel = document.getElementById("indOvrRef");
  if (!sel) return;
  const r = APP.scoredRows.find(x => x.ref === sel.value);
  if (!r) return;
  document.getElementById("indOvrL").value = String(r.L);
  document.getElementById("indOvrI").value = String(r.I);
  document.getElementById("indOvrCtl").value = r.controlRating;
  document.getElementById("indOvrBand").value = (r.overrideObj && r.overrideObj.bandOverride) || "";
  document.getElementById("indOvrComment").value = (r.overrideObj && r.overrideObj.comment) || "";
}

function populateGroupValues() {
  const dimEl = document.getElementById("grpDim");
  const valEl = document.getElementById("grpVal");
  if (!dimEl || !valEl) return;
  const dim = dimEl.value;
  const vals = [...new Set(APP.scoredRows.filter(r => !r.blocked).map(r => r.ob[dim]))].sort();
  valEl.innerHTML = vals.map(v => `<option value="${v}">${v}</option>`).join("");
}

function applyIndividualOverride() {
  const ref = document.getElementById("indOvrRef").value;
  const L = Number(document.getElementById("indOvrL").value);
  const I = Number(document.getElementById("indOvrI").value);
  const controlRating = document.getElementById("indOvrCtl").value;
  const bandOverride = document.getElementById("indOvrBand").value;
  const reasonCode = document.getElementById("indOvrReason").value;
  const comment = document.getElementById("indOvrComment").value.trim() || "Expert adjustment applied during review.";

  if ((reasonCode === "RC03" || reasonCode === "RC08") && !document.getElementById("indOvrComment").value.trim()) {
    showToast(`A rationale comment is required for ${reasonCode}.`, "warning");
    return;
  }

  const row = APP.scoredRows.find(r => r.ref === ref);
  if (bandOverride && row && row.r61Triggered && BAND_RANK[bandOverride] < BAND_RANK["High"]) {
    showToast("R61 Closure/Suspension floor cannot be lowered below High without Head of Compliance approval.", "error");
    return;
  }

  APP.overrides[ref] = { L, I, controlRating, bandOverride: bandOverride || null, reasonCode, comment, ts: new Date().toISOString() };
  executeScoringEngine(false);
  showToast(`Expert override applied to ${ref}. Original score retained for comparison.`, "success");
  renderApp();
}

function applyGroupOverride() {
  const dim = document.getElementById("grpDim").value;
  const val = document.getElementById("grpVal").value;
  const action = document.getElementById("grpAction").value;
  const reasonCode = document.getElementById("grpReason").value;
  const comment = document.getElementById("grpComment").value.trim() || `Subgroup adjustment (${val}): ${action}.`;

  const targets = APP.scoredRows.filter(r => !r.blocked && r.ob[dim] === val);
  targets.forEach(r => {
    const cur = APP.overrides[r.ref] || { L: r.sysL, I: r.sysI, controlRating: r.sysControlRating };
    if (action === "L+1") cur.L = Math.min(5, (cur.L ?? r.sysL) + 1);
    if (action === "L-1") cur.L = Math.max(1, (cur.L ?? r.sysL) - 1);
    if (action === "CTL_STRONG") cur.controlRating = "Strong";
    if (action === "CTL_WEAK") cur.controlRating = "Weak";
    APP.overrides[r.ref] = { ...cur, reasonCode, comment, ts: new Date().toISOString() };
  });

  executeScoringEngine(false);
  showToast(`Applied group override to ${targets.length} obligations in "${val}".`, "success");
  renderApp();
}

function revertOverride(ref) {
  delete APP.overrides[ref];
  executeScoringEngine(false);
  showToast(`Reverted ${ref} to original system score.`, "info");
  renderApp();
}

function clearAllOverrides() {
  APP.overrides = {};
  executeScoringEngine(false);
  showToast("Reverted all manual overrides.", "info");
  renderApp();
}

      <!-- Row 1: 5x5 Heat Map + Risk Trend Trajectory -->

        <div class="xl:col-span-7 card-surface p-5">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div>
              <h2 class="text-sm font-semibold text-slate-900">Enterprise Risk Heat Map (5 × 5)</h2>
              <p class="text-[11px] text-slate-500">Likelihood vs. Impact matrix. Click any compliance chip to view full derivation.</p>
            </div>
            <div class="inline-flex bg-slate-100 p-0.5 rounded-lg text-[11px] font-medium no-print">
              <button onclick="APP.heatmapMode='calculated'; renderApp()" class="px-2.5 py-1 rounded-md ${APP.heatmapMode === "calculated" ? "bg-white text-indigo-700 shadow-2xs" : "text-slate-600"}">Inherent (Calc)</button>
              <button onclick="APP.heatmapMode='residual'; renderApp()" class="px-2.5 py-1 rounded-md ${APP.heatmapMode === "residual" ? "bg-white text-indigo-700 shadow-2xs" : "text-slate-600"}">Residual</button>
            </div>
          </div>
          <div class="overflow-x-auto">
            <div class="min-w-[480px] grid grid-cols-6 gap-1.5">
              ${hmHtml}
              <div></div>
              <div class="text-center text-[10px] font-medium text-slate-500 pt-1">1 · Negligible</div>
              <div class="text-center text-[10px] font-medium text-slate-500 pt-1">2 · Minor</div>
              <div class="text-center text-[10px] font-medium text-slate-500 pt-1">3 · Moderate</div>
              <div class="text-center text-[10px] font-medium text-slate-500 pt-1">4 · Major</div>
              <div class="text-center text-[10px] font-medium text-slate-500 pt-1">5 · Severe</div>
            </div>
          </div>
        </div>

        <div class="xl:col-span-5 card-surface p-5 flex flex-col justify-between">
          <div>
            <h2 class="text-sm font-semibold text-slate-900">Risk Exposure Trajectory (High + Critical)</h2>
            <p class="text-[11px] text-slate-500 mt-0.5">How calibrated scoring, controls, expert judgement, and future execution evidence narrow HUL's High/Critical set.</p>
            <div class="relative h-64 mt-4">
              <canvas id="trendChart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- Row 2: Site Distribution + Law Category Distribution + Correlation Bubble View -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div class="card-surface p-5">
          <h2 class="text-sm font-semibold text-slate-900">Risk Distribution by Site / Plant</h2>
          <p class="text-[11px] text-slate-500 mt-0.5">Residual risk profile across operating units.</p>
          <div class="relative h-60 mt-3"><canvas id="siteChart"></canvas></div>
        </div>
        <div class="card-surface p-5">
          <h2 class="text-sm font-semibold text-slate-900">Risk Distribution by Law Category</h2>
          <p class="text-[11px] text-slate-500 mt-0.5">Concentration of exposure across regulatory domains.</p>
          <div class="relative h-60 mt-3"><canvas id="catChart"></canvas></div>
        </div>
        <div class="card-surface p-5">
          <h2 class="text-sm font-semibold text-slate-900">Compliance-to-Risk Correlation</h2>
          <p class="text-[11px] text-slate-500 mt-0.5">Calculated vs. Residual score (bubble size = Velocity).</p>
          <div class="relative h-60 mt-3"><canvas id="corrChart"></canvas></div>
        </div>
      </div>

      <!-- Row 3: High-Risk Compliance Clusters -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        ${clusters.map(cl => `
          <div class="rounded-xl border p-4 ${cl.accent}">
            <div class="flex items-center justify-between gap-2">
              <h3 class="text-xs font-bold">${cl.title}</h3>
              <span class="font-mono text-xs font-bold px-2 py-0.5 rounded-full bg-white/80">${cl.items.length}</span>
            </div>
            <p class="text-[11px] opacity-80 mt-1">${cl.desc}</p>
            <div class="mt-3 flex flex-wrap gap-1.5">
              ${cl.items.length ? cl.items.map(r => `<button onclick="openDrillDown('${r.ref}')" class="px-2 py-0.5 rounded-md bg-white/90 text-slate-800 text-[10px] font-mono font-semibold border border-black/10 hover:bg-white">${r.ref} · ${r.ob.obligation.slice(0, 22)}${r.ob.obligation.length > 22 ? "…" : ""}</button>`).join("") : `<span class="text-[11px] opacity-70">None in current scope</span>`}
            </div>
          </div>
        `).join("")}
      </div>

      <!-- Row 4: Top Risk Exposures Table -->
      <div class="card-surface overflow-hidden">
        <div class="px-5 py-3.5 border-b border-slate-200 flex items-center justify-between">
          <div>
            <h2 class="text-sm font-semibold text-slate-900">Top Risk Exposures (Ranked by R64)</h2>
            <p class="text-[11px] text-slate-500">Priority obligations requiring leadership visibility and targeted mitigation.</p>
          </div>
          <span class="text-xs font-mono text-slate-500">${topExposures.length} High / Critical</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-50 text-[11px] text-slate-500 border-b border-slate-200">
              <tr>
                <th class="px-5 py-2.5 font-medium">Obligation &amp; Law</th>
                <th class="px-3 py-2.5 font-medium">Site</th>
                <th class="px-3 py-2.5 font-medium">Primary Risk Driver</th>
                <th class="px-3 py-2.5 font-medium text-right">Calc → Residual</th>
                <th class="px-3 py-2.5 font-medium">Control</th>
                <th class="px-5 py-2.5 font-medium text-right">Final Band</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${topExposures.length ? topExposures.map(r => `
                <tr onclick="openDrillDown('${r.ref}')" class="hover:bg-slate-50 cursor-pointer">
                  <td class="px-5 py-3">
                    <div class="flex items-center gap-2">
                      <span class="font-mono font-semibold text-indigo-700">${r.ref}</span>
                      <span class="font-medium text-slate-900">${r.ob.obligation}</span>
                      ${r.isOverridden ? `<span class="px-1.5 py-0.5 text-[9px] rounded bg-purple-100 text-purple-700 font-semibold">Override</span>` : ""}
                    </div>
                    <div class="text-[11px] text-slate-500 mt-0.5">${r.ob.law}</div>
                  </td>
                  <td class="px-3 py-3 text-slate-600 whitespace-nowrap">${r.ob.site}</td>
                  <td class="px-3 py-3"><span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 text-[11px] font-medium">${r.mainDriver} (L${r.dims[r.mainDriver]})</span></td>
                  <td class="px-3 py-3 text-right mono-num whitespace-nowrap"><span class="text-slate-400">${r.calc}</span> → <strong class="text-slate-900">${r.res}</strong></td>
                  <td class="px-3 py-3 text-slate-600 whitespace-nowrap">${r.controlRating} (${r.cef})</td>
                  <td class="px-5 py-3 text-right whitespace-nowrap">${bandBadge(r.resBandDisplay)}</td>
                </tr>
              `).join("") : `<tr><td colspan="6" class="px-5 py-8 text-center text-slate-400">No High or Critical residual risks in the current scope.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  // Render Dashboard Charts
  if (window.Chart) {
    // 1. Trend / Trajectory Chart
    const projectedStrongHC = confirmed.filter(r => {
      const strongRes = round2(r.calc * 0.4);
      let b = getBand(strongRes, APP.config);
      if (r.r61Triggered) b = maxBand(b, "High");
      return b === "High" || b === "Critical";
    }).length;

    APP.charts.trend = new Chart(document.getElementById("trendChart"), {
      type: "line",
      data: {
        labels: ["Legacy v1.0", "Inherent (v0.2.2)", "Post-Controls", "Post-Overrides", "With Strong Ev."],
        datasets: [{
          label: "High + Critical Obligations",
          data: [v10HC, calcHC, sysResHC, resHC, projectedStrongHC],
          borderColor: "#4F46E5",
          backgroundColor: "rgba(79, 70, 229, 0.12)",
          fill: true,
          tension: 0.32,
          pointRadius: 5,
          pointBackgroundColor: ["#94A3B8", "#C9822F", "#4F46E5", "#7C3AED", "#10B981"]
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { precision: 0, font: { size: 11 } }, grid: { color: "#F1F5F9" } },
          x: { grid: { display: false }, ticks: { font: { size: 10 } } }
        }
      }
    });

    // 2. Site Distribution Stacked Bar
    const sites = ["Haridwar Plant 1", "LLPL Plant (Gujarat)"];
    const bandColors = { Critical: "#8E2B2B", High: "#C9822F", Medium: "#F1DBA8", Low: "#CBD5E1" };
    APP.charts.site = new Chart(document.getElementById("siteChart"), {
      type: "bar",
      data: {
        labels: ["Haridwar Plant 1", "LLPL (Gujarat)"],
        datasets: ["Critical", "High", "Medium", "Low"].map(b => ({
          label: b,
          data: sites.map(s => confirmed.filter(r => r.ob.site === s && r.resBand === b).length),
          backgroundColor: bandColors[b],
          borderRadius: 4
        }))
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } } },
        scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 }, grid: { color: "#F1F5F9" } } }
      }
    });

    // 3. Category Distribution Horizontal Stacked Bar
    const cats = [...new Set(confirmed.map(r => r.ob.category))];
    APP.charts.cat = new Chart(document.getElementById("catChart"), {
      type: "bar",
      data: {
        labels: cats.map(c => c.replace(" and ", " & ").replace("Product, quality & metrology", "Product & Metrology").replace("Health, safety & factory", "Health & Safety")),
        datasets: ["Critical", "High", "Medium", "Low"].map(b => ({
          label: b,
          data: cats.map(c => confirmed.filter(r => r.ob.category === c && r.resBand === b).length),
          backgroundColor: bandColors[b],
          borderRadius: 4
        }))
      },
      options: {
        indexAxis: "y", responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } } },
        scales: { x: { stacked: true, beginAtZero: true, ticks: { precision: 0 }, grid: { color: "#F1F5F9" } }, y: { stacked: true, grid: { display: false }, ticks: { font: { size: 10 } } } }
      }
    });

    // 4. Compliance-to-Risk Correlation Bubble Chart
    APP.charts.corr = new Chart(document.getElementById("corrChart"), {
      type: "bubble",
      data: {
        datasets: ["Critical", "High", "Medium", "Low"].map(b => ({
          label: b,
          backgroundColor: bandColors[b] + "CC",
          borderColor: bandColors[b],
          data: confirmed.filter(r => r.resBand === b).map(r => ({
            x: r.calc, y: r.res, r: r.velClass === "High" ? 9 : (r.velClass === "Medium" ? 6.5 : 4.5),
            ref: r.ref, title: r.ob.obligation
          }))
        }))
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } },
          tooltip: {
            callbacks: {
              label: (ctx) => `${ctx.raw.ref}: Calc ${ctx.raw.x} → Res ${ctx.raw.y}`
            }
          }
        },
        scales: {
          x: { title: { display: true, text: "Calculated Score", font: { size: 10 } }, beginAtZero: true, grid: { color: "#F1F5F9" } },
          y: { title: { display: true, text: "Residual Score", font: { size: 10 } }, beginAtZero: true, grid: { color: "#F1F5F9" } }
        }
      }
    });
  }
}

// ============================================================================
// DRILL-DOWN DRAWER & EXCEL EXPORT
// ============================================================================
function openDrillDown(ref) {
  const r = APP.scoredRows.find(x => x.ref === ref);
  if (!r) return;
  const ob = r.ob;

  document.getElementById("drawerWrap").classList.remove("hidden");
  document.getElementById("drawerHeader").innerHTML = `
    <div>
      <div class="flex items-center gap-2">
        <span class="font-mono font-bold text-sm text-indigo-700">${ob.ref}</span>
        ${bandBadge(r.resBandDisplay)}
        ${r.isOverridden ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-purple-100 text-purple-700">Expert Adjusted</span>` : ""}
      </div>
      <h2 class="text-base font-bold text-slate-900 mt-1">${ob.obligation}</h2>
      <div class="text-xs text-slate-500 mt-0.5">${ob.site} (${ob.state}) · ${ob.law}</div>
    </div>
    <button onclick="closeDrillDown()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/60"><i data-lucide="x" class="w-5 h-5"></i></button>
  `;

  document.getElementById("drawerBody").innerHTML = `
    <!-- Equation Strip -->
    <div class="grid grid-cols-5 gap-2 p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-center text-xs">
      <div><div class="text-[10px] text-slate-400">Likelihood</div><div class="font-bold mono-num text-sm mt-0.5">${r.L ?? "—"}</div><div class="text-[10px] text-slate-500">${r.L_label}</div></div>
      <div><div class="text-[10px] text-slate-400">Impact</div><div class="font-bold mono-num text-sm mt-0.5">${r.I ?? "—"}</div><div class="text-[10px] text-slate-500">${r.mainDriver}</div></div>
      <div><div class="text-[10px] text-slate-400">Velocity</div><div class="font-bold mono-num text-sm mt-0.5">${r.V ?? "—"}x</div><div class="text-[10px] text-slate-500">${r.velClass}</div></div>
      <div><div class="text-[10px] text-slate-400">Calculated</div><div class="font-bold mono-num text-sm mt-0.5">${r.calc ?? "—"}</div><div class="mt-0.5">${bandBadge(r.calcBand, "xs")}</div></div>
      <div><div class="text-[10px] text-slate-400">Residual (${r.cef ?? "—"})</div><div class="font-bold mono-num text-sm mt-0.5 text-indigo-700">${r.res ?? "—"}</div><div class="mt-0.5">${bandBadge(r.resBandDisplay, "xs")}</div></div>
    </div>

    <!-- Sub-Dimension Breakdown -->
    ${!r.blocked ? `
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
        <div class="p-4 rounded-xl border border-slate-200 space-y-2">
          <div class="font-semibold text-slate-800">Impact Sub-Dimensions</div>
          ${Object.entries(r.dims).map(([k, v]) => `
            <div class="flex items-center justify-between">
              <span class="text-slate-600">${k}</span>
              <span class="font-mono font-bold ${v === r.I && v > 0 ? "text-indigo-700" : "text-slate-800"}">${v} / 5</span>
            </div>
          `).join("")}
        </div>
        <div class="p-4 rounded-xl border border-slate-200 space-y-2">
          <div class="font-semibold text-slate-800">Control Sub-Attributes (Interim)</div>
          <div class="flex items-center justify-between"><span class="text-slate-600">Design (Requires Proof)</span><span class="font-mono font-bold">${r.interim.design} / 2</span></div>
          <div class="flex items-center justify-between"><span class="text-slate-600">Ownership (Owner ≠ Reviewer)</span><span class="font-mono font-bold">${r.interim.ownership} / 2</span></div>
          <div class="flex items-center justify-between"><span class="text-slate-600">Frequency Alignment</span><span class="font-mono font-bold">${r.interim.frequency} / 2</span></div>
          <div class="flex items-center justify-between"><span class="text-slate-600">Maturity (Escalations)</span><span class="font-mono font-bold">${r.interim.maturity} / 2</span></div>
        </div>
      </div>
    ` : ""}

    <!-- Step-by-step Derivation Rationale -->
    <div class="space-y-2">
      <div class="text-xs font-semibold text-slate-800">Score Derivation &amp; Supporting Rationale</div>
      ${r.trace.map(t => `
        <div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-3 text-xs">
          <span class="font-mono font-bold text-[10px] px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 border border-indigo-200 shrink-0">${t.rule}</span>
          <span class="text-slate-700 leading-relaxed">${t.text}</span>
        </div>
      `).join("")}
    </div>

    <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-xs space-y-1">
      <div class="font-semibold text-slate-800">Statutory Reference</div>
      <div class="text-indigo-700 font-mono text-[11px]">${ob.citation || "Unlinked"}</div>
      <p class="text-slate-600 italic mt-1">${ob.citationExcerpt ? `"${ob.citationExcerpt}"` : "No statutory excerpt available."}</p>
    </div>
  `;
  if (window.lucide) lucide.createIcons();
}

function closeDrillDown() {
  document.getElementById("drawerWrap").classList.add("hidden");
}

function escapeXml(v) {
  return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function exportExecutiveWorkbook() {
  executeScoringEngine(false);
  const headers = ["Ref", "Entity", "Site", "State", "Law", "Category", "Obligation", "Likelihood", "Impact", "Velocity", "Calculated", "Calc Band", "Control", "CEF", "Residual", "Final Band", "Overridden", "Score Status"];
  const rows = APP.scoredRows.map(r => [r.ref, r.ob.entity, r.ob.site, r.ob.state, r.ob.law, r.ob.category, r.ob.obligation, r.L ?? "", r.I ?? "", r.velClass, r.calc ?? "", r.calcBand, r.controlRating, r.cef ?? "", r.res ?? "", r.resBandDisplay, r.isOverridden ? "Yes" : "No", r.scoreStatus]);
  const headXml = `<Row>${headers.map(h => `<Cell ss:StyleID="hdr"><Data ss:Type="String">${escapeXml(h)}</Data></Cell>`).join("")}</Row>`;
  const bodyXml = rows.map(row => `<Row>${row.map(v => `<Cell><Data ss:Type="${typeof v === "number" ? "Number" : "String"}">${escapeXml(v)}</Data></Cell>`).join("")}</Row>`).join("");
  const xml = `<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?>
    <Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
      <Styles><Style ss:ID="hdr"><Font ss:Bold="1"/><Interior ss:Color="#EEF2FF" ss:Pattern="Solid"/></Style></Styles>
      <Worksheet ss:Name="Risk Assessment"><Table>${headXml}${bodyXml}</Table></Worksheet>
    </Workbook>`;
  const blob = new Blob([xml], { type: "application/vnd.ms-excel" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `HUL_RegIQ_Assessment_${APP.config.version}.xls`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast("Downloaded HUL_RegIQ_Assessment_v0.2.2.xls", "success");
}

// ---------- 7. BOOTSTRAP ----------
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("drawerBackdrop").addEventListener("click", closeDrillDown);
  document.getElementById("exportQuickBtn").addEventListener("click", exportExecutiveWorkbook);
  document.getElementById("resetDemoBtn").addEventListener("click", () => {
    APP.selectedRefs = new Set(MASTER_LIBRARY.filter(o => o.isCalibration).map(o => o.ref));
    APP.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    APP.overrides = {};
    APP.step = 1;
    executeScoringEngine(false);
    showToast("Demo reset to default 10-compliance HUL calibration scope.", "info");
    renderApp();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrillDown(); });

  executeScoringEngine(false);
  renderApp();
});
</script>
